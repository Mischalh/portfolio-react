# Bouwt de site en zet hem live op GitHub Pages bij elke push naar main.
# Waarom een workflow: dan hoef je nooit zelf `dist/` te uploaden;
# GitHub bouwt de site met precies dezelfde stappen als `npm run build`.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # handmatig opnieuw starten vanuit het Actions-tabblad

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee deploys tegelijk; een nieuwe push vervangt een lopende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
